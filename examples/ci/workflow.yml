name: faultlens-analysis

# Analyze logs with FaultLens in CI, publish JSON + HTML artifacts and write a
# job summary. Trigger manually or adapt to your own logs.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: FaultLens analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Analyze logs (JSON)
        run: go run ./cmd/faultlens ./logs/*.log --output json > faultlens.json

      - name: Generate HTML report
        run: go run ./cmd/faultlens ./logs/*.log --output html -o faultlens-report.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faultlens-analysis
          path: |
            faultlens.json
            faultlens-report.html

      - name: Write job summary
        run: |
          ROOT_CAUSE=$(grep -o '"root_cause": *"[^"]*"' faultlens.json | head -1 | sed 's/.*: *"//;s/"$//')
          CONFIDENCE=$(grep -o '"confidence": *[0-9.]*' faultlens.json | head -1 | sed 's/.*: *//')
          {
            echo "## FaultLens Analysis"
            echo "- **Root Cause:** $ROOT_CAUSE"
            echo "- **Confidence:** $CONFIDENCE"
            echo "- Artifacts: \`faultlens.json\`, \`faultlens-report.html\`"
          } >> "$GITHUB_STEP_SUMMARY"